title: 'DML: Difference-in-Differences (Panel)'
name: dmldid
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome after the treatment
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Outcome before the treatment
            children:
                - type: VariablesListBox
                  name: before
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treated group (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates (measured before the treatment)
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: Learners
      collapsed: false
      children:
          - type: ComboBox
            name: lrn_g
          - type: ComboBox
            name: lrn_m
          - type: TextBox
            name: trim
            label: Trim propensity scores at
            format: number
          - type: ComboBox
            name: rule
    - type: CollapseBox
      label: Cross-fitting
      collapsed: true
      children:
          - type: TextBox
            name: folds
            label: Number of folds
            format: number
          - type: TextBox
            name: reps
            label: Number of repetitions of the sample split
            format: number
          - type: TextBox
            name: seed
            label: Random seed
            format: number
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
