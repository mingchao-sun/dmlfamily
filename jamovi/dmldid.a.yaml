---
name: dmldid
title: 'DML: Difference-in-Differences (Panel)'
jas: '1.2'
version: '1.0.0'
menuGroup: DML
menuTitle: Difference-in-Differences (Panel)
menuSubtitle: Effect on the treated, two periods, many controls

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome after the treatment
      type: Variable
      permitted:
          - numeric

    - name: before
      title: Outcome before the treatment
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: Treated group (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates (measured before the treatment)
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: lrn_g
      title: Learner for the change of the outcome of the controls
      type: List
      options:
          - name: ols
            title: 'Linear / logistic regression'
          - name: lasso
            title: 'Lasso'
          - name: ridge
            title: 'Ridge'
          - name: enet
            title: 'Elastic net (alpha 0.5)'
          - name: rf
            title: 'Random forest'
      default: lasso

    - name: lrn_m
      title: Learner for the propensity score, P(treated|X)
      type: List
      options:
          - name: ols
            title: 'Linear / logistic regression'
          - name: lasso
            title: 'Lasso'
          - name: ridge
            title: 'Ridge'
          - name: enet
            title: 'Elastic net (alpha 0.5)'
          - name: rf
            title: 'Random forest'
      default: lasso

    - name: trim
      title: Trim propensity scores at
      type: Number
      default: 0.01
      min: 0.0001
      max: 0.2

    - name: plot
      title: Propensity score plot
      type: Bool
      default: true

    - name: rule
      title: Penalty chosen by cross-validation at
      type: List
      options:
          - name: lambda.min
            title: 'The minimum error'
          - name: lambda.1se
            title: 'One standard error above the minimum'
      default: lambda.min

    - name: folds
      title: Number of folds
      type: Integer
      default: 5
      min: 2
      max: 20

    - name: reps
      title: Number of repetitions of the sample split
      type: Integer
      default: 1
      min: 1
      max: 50

    - name: seed
      title: Random seed
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
