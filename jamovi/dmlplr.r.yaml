---
name: dmlplr
title: 'DML: Partially Linear Regression'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: est
      title: 'Treatment effect'
      type: Table
      rows: 0
      clearWith: [outcome, treat, covs, lrn_l, lrn_m, rule, folds, reps, seed, level]
      columns:
        - name: term
          title: ''
          type: text
        - name: coef
          title: Estimate
          type: number
        - name: se
          title: Std. error
          type: number
        - name: z
          title: z
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: lo
          title: CI lower
          type: number
        - name: hi
          title: CI upper
          type: number

    - name: nuis
      title: 'Out-of-sample accuracy of the learners'
      type: Table
      rows: 0
      clearWith: [outcome, treat, covs, lrn_l, lrn_m, rule, folds, reps, seed, level]
      columns:
        - name: fn
          title: Nuisance function
          type: text
        - name: learner
          title: Learner
          type: text
        - name: rmse
          title: RMSE
          type: number
        - name: r2
          title: R2
          type: number

    - name: reps
      title: 'Estimates by repetition of the sample split'
      type: Table
      rows: 0
      visible: false
      clearWith: [outcome, treat, covs, lrn_l, lrn_m, rule, folds, reps, seed, level]
      columns:
        - name: rep
          title: Repetition
          type: integer
        - name: coef
          title: Estimate
          type: number
        - name: se
          title: Std. error
          type: number

refs:
    - chernozhukov2018
    - doubleml

...
